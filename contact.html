<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact — BMI Calculator</title><meta name="description" content="Get in touch with feedback, questions or translation suggestions.">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6F1;--surface:#fff;--primary:#2F6F5E;--text:#1C2B26;--muted:#5B6B65;--border:#DCE5DD;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101C17;--surface:#17251F;--primary:#5FB79B;--text:#EAF2ED;--muted:#93A39C;--border:#28392F;color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.65;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2{font-family:'Outfit',sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--border)}
.hi{max-width:640px;margin:0 auto;padding:14px 20px}
.brand{font-weight:700;color:var(--text);text-decoration:none}
main{padding:28px 0 50px}
h1{font-size:1.6rem;margin-bottom:6px}
.updated{color:var(--muted);font-size:.85rem;margin-bottom:20px}
h2{font-size:1.15rem;margin:24px 0 8px}
p,li{color:var(--muted);font-size:.95rem;margin-bottom:10px}
ul{padding-left:20px}
a{color:var(--primary)}
label{display:block;font-weight:600;font-size:.85rem;margin:14px 0 6px}
input,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:11px;background:var(--surface);color:var(--text);font:inherit}
button{margin-top:16px;width:100%;padding:13px;border:none;border-radius:12px;background:var(--primary);color:#fff;font:inherit;font-weight:700;cursor:pointer}
footer{border-top:1px solid var(--border);padding:22px 0 40px;text-align:center;font-size:.8rem;color:var(--muted)}
footer a{margin:0 8px}
</style></head><body>
<header><div class="hi"><a class="brand" href="index.html">⚖️ BMI Calculator</a></div></header>
<main class="wrap">
<h1>Contact us</h1>
<p>We'd love to hear from you: feedback, bug reports, translation corrections or requests for new tools.</p>
<p>Email: <a href="mailto:[YOUR EMAIL]">[YOUR EMAIL]</a></p>
<form action="mailto:[YOUR EMAIL]" method="post" enctype="text/plain">
<label for="n">Your name</label><input id="n" name="name" required>
<label for="e">Your email</label><input id="e" name="email" type="email" required>
<label for="m">Message</label><textarea id="m" name="message" rows="5" required></textarea>
<button type="submit">Send message</button>
</form>
<p style="margin-top:16px">We aim to reply within a few days.</p>
</main><footer><a href="index.html">Home</a><a href="about.html">About</a><a href="privacy.html">Privacy Policy</a><a href="contact.html">Contact</a></footer></body></html>
